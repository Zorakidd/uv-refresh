name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/uv-refresh/
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Test before releasing
        run: |
          uv run ruff check .
          uv run ty check .
          uv run pytest

      - name: Bump version
        id: bump
        run: |
          uv version --bump ${{ inputs.bump }}
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "Release v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD --tags

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Fallback via API token, solange der Trusted-Publisher-Eintrag auf
          # PyPI noch auf den alten Workflow-Namen (publish.yml) zeigt. Sobald
          # das dort auf release.yml korrigiert ist, kann PYPI_API_TOKEN als
          # Secret wieder entfernt werden -- die Action faellt dann automatisch
          # auf Trusted Publishing (id-token: write, oben) zurueck.
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub release
        # Nur noch fuer die Changelog-Seite auf GitHub -- publish ist zu diesem
        # Zeitpunkt schon passiert, haengt also nicht mehr am 'release:
        # published'-Event und braucht darum keinen PAT mehr (der Standard-
        # GITHUB_TOKEN loest zwar keine anderen Workflows aus, aber es gibt
        # hier auch keinen anderen Workflow mehr, der darauf wartet).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.bump.outputs.version }}" --generate-notes
